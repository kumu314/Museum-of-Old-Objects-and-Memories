name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # vitest 5 要求 Node >=22.12，CI 与本地共用 .node-version，不再各写一套
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 全仓库噪声扫描
        run: node scripts/scan-noise.mjs

      - name: 提交信息检查
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/lint-commit.mjs --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            node scripts/lint-commit.mjs --range "HEAD~1..HEAD"
          else
            node scripts/lint-commit.mjs --range "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: 类型检查
        run: pnpm run typecheck

      - name: lint
        run: pnpm run lint

      - name: 单元测试
        run: pnpm run test

      - name: 生产构建
        run: pnpm run build
