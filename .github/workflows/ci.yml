name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 音频解析运行依赖
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm db:local
      - run: pnpm db:migrate && pnpm db:migrate:test
      - run: bash scripts/check.sh
        env:
          APP_ORIGIN: https://museum.example.test
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
      - if: always()
        run: docker compose -f compose.local.yml stop
